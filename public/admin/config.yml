local_backend: true
publish_mode: editorial_workflow
backend:
  name: git-gateway
  branch: main

media_folder: "public"
public_folder: ""

collections:
  - name: "projects"
    label: "Community Projects"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Project Title", name: "title", widget: "string" }
      - { label: "Subtitle / Short Description", name: "subtitle", widget: "string" }
      - { label: "Display Badge (e.g. Project, Workshop, Installation...)", name: "badge", widget: "string", default: "Project" }
      - label: "Place in Section (Select from Homepage Sections)"
        name: "section"
        widget: "relation"
        collection: "pages"
        file: "home"
        search_fields: ["blocks.*.title", "blocks.*.sectionFilter"]
        value_field: "blocks.*.sectionFilter"
        display_fields: ["blocks.*.title"]
        hint: "💡 Choose the desired project section (e.g. Featured Projects)."
        required: false
      - { label: "Display Order", name: "order", widget: "number", default: 1 }
      - { label: "Hero Cover Image", name: "heroImage", widget: "image" }
      - { label: "Meta Title (SEO)", name: "metaTitle", widget: "string", required: false }
      - { label: "Meta Description (SEO)", name: "metaDescription", widget: "text", required: false }
      - { label: "Image Gallery (first 6 visible in grid)", name: "galleryImages", widget: "list", required: false, field: { label: "Image", name: "image", widget: "image" } }
      - { label: "Main Section Heading", name: "mainHeading", widget: "string", required: false }
      - { label: "Lead Paragraph", name: "leadParagraph", widget: "text", required: false }
      - { label: "Detailed Paragraphs", name: "paragraphs", widget: "list", required: false, field: { label: "Paragraph", name: "paragraph", widget: "text" } }
      - { label: "Artist Quote", name: "quote", widget: "string", required: false }
      - label: "Articles & External Links"
        name: "externalLinks"
        widget: "list"
        required: false
        fields:
          - { label: "Emoji Icon", name: "icon", widget: "string" }
          - { label: "Tag / Source", name: "tag", widget: "string" }
          - { label: "Article Title", name: "title", widget: "string" }
          - { label: "Description", name: "desc", widget: "text" }
          - { label: "Link URL", name: "url", widget: "string" }
          - { label: "Button Text", name: "btnText", widget: "string" }
      - label: "Technical Specifications (Sidebar)"
        name: "sidebarMeta"
        widget: "list"
        required: false
        fields:
          - { label: "Label (e.g. Year)", name: "label", widget: "string" }
          - { label: "Value (e.g. 2023)", name: "value", widget: "string" }
      - { label: "Embedded YouTube Video URL", name: "embeddedVideoYoutubeUrl", widget: "string", required: false }
      - { label: "👁️ DISPLAY: Image Gallery", name: "showGallery", widget: "boolean", default: true, required: false }
      - { label: "👁️ DISPLAY: Articles & Links", name: "showExternalLinks", widget: "boolean", default: true, required: false }
      - { label: "👁️ DISPLAY: Technical Specifications (Sidebar)", name: "showSidebarMeta", widget: "boolean", default: true, required: false }
      - { label: "👁️ DISPLAY: Previous / Next Navigation", name: "showNav", widget: "boolean", default: true, required: false }
      - { label: "👁️ DISPLAY: YouTube Video", name: "showVideo", widget: "boolean", default: true, required: false }


  - name: "artworks"
    label: "Artworks & Galleries"
    folder: "src/content/artworks"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Full Series Title", name: "title", widget: "string" }
      - { label: "Display Title", name: "displayTitle", widget: "string" }
      - label: "Filter Category (Select from Homepage Filters)"
        name: "category"
        widget: "relation"
        collection: "pages"
        file: "home"
        search_fields: ["artworkFilters.*.label", "artworkFilters.*.value"]
        value_field: "artworkFilters.*.value"
        display_fields: ["artworkFilters.*.label"]
      - { label: "Subtitle / Category Label", name: "categoryLabel", widget: "string", required: false }
      - { label: "Display Badge", name: "badge", widget: "string" }
      - { label: "Display Order", name: "order", widget: "number", default: 1 }
      - { label: "Short Description", name: "desc", widget: "string" }
      - { label: "Card Description", name: "cardDesc", widget: "text" }
      - { label: "Cover Image", name: "coverImage", widget: "image" }
      - { label: "Image Gallery (Lightbox Slideshow)", name: "images", widget: "list", required: false, field: { label: "Image", name: "image", widget: "image" } }

  - name: "pages"
    label: "Site Pages"
    files:
      - file: "src/content/pages/home.json"
        label: "Home Page (Configuration & Blocks)"
        name: "home"
        fields:
          - label: "SEO Meta Title"
            name: "title"
            widget: "string"
            default: "Muhsana Ali | Multidisciplinary Artist"
          - label: "SEO Meta Description"
            name: "description"
            widget: "text"
            default: "Official website of artist Muhsana Ali."
          - label: "Home Page Blocks & Sections"
            name: "blocks"
            widget: "list"
            types:
              - label: "Hero Section (Header Banner)"
                name: "hero_block"
                widget: "object"
                fields:
                  - { label: "Enable this section", name: "active", widget: "boolean", default: true }
                  - { label: "Memorial button text", name: "memorialBtnText", widget: "string", default: "View Memorial" }
                  - { label: "Memorial button URL", name: "memorialBtnUrl", widget: "string", default: "/projects/bethel" }
                  - { label: "Scroll / Explore button text", name: "scrollBtnText", widget: "string", default: "Explore" }
              - label: "About Section"
                name: "about_block"
                widget: "object"
                fields:
                  - { label: "Enable this section", name: "active", widget: "boolean", default: true }
                  - { label: "Section title on page", name: "title", widget: "string", default: "About Muhsana" }
                  - { label: "Navigation menu text (optional)", name: "navTitle", widget: "string", default: "About", required: false }
                  - { label: "Subtitle / Header", name: "subtitle", widget: "string", default: "Approach & Vision" }
              - label: "Projects Section"
                name: "projects_block"
                widget: "object"
                fields:
                  - { label: "Enable this section", name: "active", widget: "boolean", default: true }
                  - { label: "Section title on page", name: "title", widget: "string", default: "Featured Projects" }
                  - { label: "Navigation menu text (optional)", name: "navTitle", widget: "string", default: "Projects", required: false }
                  - { label: "Section subtitle", name: "subtitle", widget: "string", default: "Community Engagement & Major Works" }
                  - { label: "Unique Section Filter ID (e.g. principaux, section1)", name: "sectionFilter", widget: "string", default: "principaux" }
                  - { label: "Project card button text", name: "cardBtnText", widget: "string", default: "Discover project →" }
                  - { label: "Previous Project button text (Detail pages)", name: "prevBtnText", widget: "string", default: "← Previous project", required: false }
                  - { label: "Next Project button text (Detail pages)", name: "nextBtnText", widget: "string", default: "Next project →", required: false }
              - label: "Artworks & Galleries Section"
                name: "artworks_block"
                widget: "object"
                fields:
                  - { label: "Enable this section", name: "active", widget: "boolean", default: true }
                  - { label: "Section title on page", name: "title", widget: "string", default: "Artworks" }
                  - { label: "Navigation menu text (optional)", name: "navTitle", widget: "string", default: "Artworks", required: false }
                  - { label: "Section subtitle", name: "subtitle", widget: "string", default: "Visual & Sculptural Exploration" }
              - label: "Interactive Map Section"
                name: "map_block"
                widget: "object"
                fields:
                  - { label: "Enable this section", name: "active", widget: "boolean", default: true }
                  - { label: "Section title on page", name: "title", widget: "string", default: "Artistic Journey of Muhsana Ali" }
                  - { label: "Navigation menu text (optional)", name: "navTitle", widget: "string", default: "Journey (Map)", required: false }
                  - { label: "Section subtitle", name: "subtitle", widget: "string", default: "Geography & International Journey" }
                  - { label: "Section description", name: "description", widget: "text", default: "Explore cities, residencies, exhibitions, and community projects across Africa, Europe, and the United States." }
                  - { label: "Timeline button text", name: "timelineBtnText", widget: "string", default: "Timeline" }
          - label: "Artwork Gallery Filters (Category Buttons)"
            name: "artworkFilters"
            widget: "list"
            fields:
              - { label: "Filter Label (e.g. Sculpture & Installation)", name: "label", widget: "string" }
              - { label: "Filter ID (e.g. sculpture, mosaic, photography, peinture)", name: "value", widget: "string" }
