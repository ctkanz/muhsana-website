local_backend: true
publish_mode: editorial_workflow
backend:
  name: git-gateway
  branch: main

media_folder: "public"
public_folder: ""

collections:
  - name: "projects"
    label: "Projets Communautaires"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre du Projet", name: "title", widget: "string" }
      - { label: "Sous-titre / Description Courte", name: "subtitle", widget: "string" }
      - { label: "Badge d'affichage (ex: Projet, Atelier, Installation...)", name: "badge", widget: "string", default: "Projet" }
      - label: "Placer dans la Section (Sélectionner parmi vos sections de la Page d'Accueil)"
        name: "section"
        widget: "relation"
        collection: "pages"
        file: "home"
        search_fields: ["blocks.*.title", "blocks.*.sectionFilter"]
        value_field: "blocks.*.sectionFilter"
        display_fields: ["blocks.*.title"]
        hint: "💡 Choisissez la section de projets souhaitée (ex: Projets Principaux). Seules les sections de type 'Section Projets' possèdent un identifiant de filtre."
        required: false
      - { label: "Ordre d'affichage", name: "order", widget: "number", default: 1 }
      - { label: "Image de Couverture Hero", name: "heroImage", widget: "image" }
      - { label: "Titre Meta (SEO)", name: "metaTitle", widget: "string", required: false }
      - { label: "Description Meta (SEO)", name: "metaDescription", widget: "text", required: false }
      - { label: "Galerie d'images (6 premières visibles sur la grille)", name: "galleryImages", widget: "list", required: false, field: { label: "Image", name: "image", widget: "image" } }
      - { label: "Titre de la Section Principale", name: "mainHeading", widget: "string", required: false }
      - { label: "Paragraphe d'accroche (Lead)", name: "leadParagraph", widget: "text", required: false }
      - { label: "Paragraphes détaillés", name: "paragraphs", widget: "list", required: false, field: { label: "Paragraphe", name: "paragraph", widget: "text" } }
      - { label: "Citation de l'Artiste", name: "quote", widget: "string", required: false }
      - label: "Articles & Liens Externes"
        name: "externalLinks"
        widget: "list"
        required: false
        fields:
          - { label: "Icône Emoji", name: "icon", widget: "string" }
          - { label: "Tag / Source", name: "tag", widget: "string" }
          - { label: "Titre de l'article", name: "title", widget: "string" }
          - { label: "Description", name: "desc", widget: "text" }
          - { label: "URL du lien", name: "url", widget: "string" }
          - { label: "Texte du bouton", name: "btnText", widget: "string" }
      - label: "Fiche Technique (Sidebar)"
        name: "sidebarMeta"
        widget: "list"
        required: false
        fields:
          - { label: "Libellé (ex: Année)", name: "label", widget: "string" }
          - { label: "Valeur (ex: 2023)", name: "value", widget: "string" }
      - { label: "URL Vidéo YouTube Intégrée", name: "embeddedVideoYoutubeUrl", widget: "string", required: false }
      - label: "Projet Précédent"
        name: "prevProject"
        widget: "object"
        required: false
        fields:
          - { label: "Slug du projet", name: "slug", widget: "string" }
          - { label: "Titre du projet", name: "title", widget: "string" }
      - label: "Projet Suivant"
        name: "nextProject"
        widget: "object"
        required: false
        fields:
          - { label: "Slug du projet", name: "slug", widget: "string" }
          - { label: "Titre du projet", name: "title", widget: "string" }

  - name: "artworks"
    label: "Œuvres & Galeries"
    folder: "src/content/artworks"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre Complet de la Série", name: "title", widget: "string" }
      - { label: "Titre d'Affichage", name: "displayTitle", widget: "string" }
      - label: "Catégorie de Filtre (Sélectionner parmi vos filtres de la Page d'Accueil)"
        name: "category"
        widget: "relation"
        collection: "pages"
        file: "home"
        search_fields: ["artworkFilters.*.label", "artworkFilters.*.value"]
        value_field: "artworkFilters.*.value"
        display_fields: ["artworkFilters.*.label"]
      - { label: "Sous-titre / Libellé Catégorie", name: "categoryLabel", widget: "string", required: false }
      - { label: "Badge d'Affichage", name: "badge", widget: "string" }
      - { label: "Ordre d'affichage", name: "order", widget: "number", default: 1 }
      - { label: "Description Courte", name: "desc", widget: "string" }
      - { label: "Description de la Carte", name: "cardDesc", widget: "text" }
      - { label: "Image de Couverture", name: "coverImage", widget: "image" }
      - { label: "Galerie d'images (Diaporama Lightbox)", name: "images", widget: "list", required: false, field: { label: "Image", name: "image", widget: "image" } }

  - name: "pages"
    label: "Pages du Site"
    files:
      - file: "src/content/pages/home.json"
        label: "Page d'Accueil (Configuration & Blocs)"
        name: "home"
        fields:
          - label: "Titre SEO Meta"
            name: "title"
            widget: "string"
            default: "Muhsana Ali | Artiste Multidisciplinaire"
          - label: "Description SEO Meta"
            name: "description"
            widget: "text"
            default: "Site officiel de l'artiste Muhsana Ali."
          - label: "Blocs & Sections de la Page d'Accueil"
            name: "blocks"
            widget: "list"
            types:
              - label: "Section Hero (Bannière d'en-tête)"
                name: "hero_block"
                widget: "object"
                fields:
                  - { label: "Activer cette section", name: "active", widget: "boolean", default: true }
                  - { label: "Texte du bouton Mémorial", name: "memorialBtnText", widget: "string", default: "Voir le mémorial" }
                  - { label: "Lien du bouton Mémorial", name: "memorialBtnUrl", widget: "string", default: "/projects/bethel" }
                  - { label: "Texte du bouton Défiler / Explorer", name: "scrollBtnText", widget: "string", default: "Explorer" }
              - label: "Section À Propos"
                name: "about_block"
                widget: "object"
                fields:
                  - { label: "Activer cette section", name: "active", widget: "boolean", default: true }
                  - { label: "Titre de la Section sur la page", name: "title", widget: "string", default: "About Muhsana" }
                  - { label: "Texte affiché dans le Menu de Navigation (optionnel)", name: "navTitle", widget: "string", default: "À Propos", required: false }
                  - { label: "Sous-titre / En-tête", name: "subtitle", widget: "string", default: "Démarche & Vision" }
              - label: "Section Projets (Personnalisable)"
                name: "projects_block"
                widget: "object"
                fields:
                  - { label: "Activer cette section", name: "active", widget: "boolean", default: true }
                  - { label: "Titre de la Section sur la page", name: "title", widget: "string", default: "Projets Principaux" }
                  - { label: "Texte affiché dans le Menu de Navigation (optionnel)", name: "navTitle", widget: "string", default: "Projets", required: false }
                  - { label: "Sous-titre de la Section", name: "subtitle", widget: "string", default: "Engagement Communautaire & Œuvres Majeures" }
                  - { label: "Identifiant Unique de la Section (ex: principaux, section1)", name: "sectionFilter", widget: "string", default: "principaux" }
                  - { label: "Texte des boutons des cartes de projet", name: "cardBtnText", widget: "string", default: "Découvrir le projet →" }
              - label: "Section Œuvres & Galeries"
                name: "artworks_block"
                widget: "object"
                fields:
                  - { label: "Activer cette section", name: "active", widget: "boolean", default: true }
                  - { label: "Titre de la Section sur la page", name: "title", widget: "string", default: "Œuvres" }
                  - { label: "Texte affiché dans le Menu de Navigation (optionnel)", name: "navTitle", widget: "string", default: "Œuvres", required: false }
                  - { label: "Sous-titre de la Section", name: "subtitle", widget: "string", default: "Exploration Visuelle & Sculpturale", hint: "👇 Pour ajouter ou gérer les filtres de catégories (Sculpture, Peinture...), faites défiler vers le bas de la page jusqu'à 'Filtres de la Galerie d'Œuvres'." }
              - label: "Section Carte Interactive"
                name: "map_block"
                widget: "object"
                fields:
                  - { label: "Activer cette section", name: "active", widget: "boolean", default: true }
                  - { label: "Titre de la Section sur la page", name: "title", widget: "string", default: "Parcours Artistique de Muhsana Ali" }
                  - { label: "Texte affiché dans le Menu de Navigation (optionnel)", name: "navTitle", widget: "string", default: "Parcours (Carte)", required: false }
                  - { label: "Sous-titre de la Section", name: "subtitle", widget: "string", default: "Géographie & Parcours International" }
                  - { label: "Description de la Section", name: "description", widget: "text", default: "Explorez les villes, résidences, expositions et projets communautaires à travers l'Afrique, l'Europe et les États-Unis." }
                  - { label: "Texte du bouton Chronologie", name: "timelineBtnText", widget: "string", default: "Chronologie" }
          - label: "Filtres de la Galerie d'Œuvres (Boutons de catégorie)"
            name: "artworkFilters"
            widget: "list"
            fields:
              - { label: "Libellé du Filtre (ex: Sculpture & Installation)", name: "label", widget: "string" }
              - { label: "Identifiant (ex: sculpture, mosaic, photography, peinture)", name: "value", widget: "string" }
