<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Muhsana Ali - Impression Haute Résolution</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #f7f7f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #111;
    }
    .card {
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 500px;
      width: 100%;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 24px;
    }
    .qr-container {
      width: 320px;
      height: 320px;
      margin: 0 auto 24px;
      padding: 16px;
      border: 1px solid #eee;
      border-radius: 12px;
      background: #fff;
    }
    .qr-container img, .qr-container svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .url {
      font-family: monospace;
      font-size: 13px;
      background: #f0f0f2;
      padding: 8px 14px;
      border-radius: 6px;
      color: #333;
      word-break: break-all;
      margin-bottom: 24px;
    }
    .btn-print {
      background: #111;
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-print:hover {
      background: #333;
    }
    @media print {
      body {
        padding: 0;
        background: #fff;
      }
      .card {
        box-shadow: none;
        padding: 20px;
        max-width: 100%;
      }
      .btn-print {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">Muhsana Ali</div>
    <div class="subtitle">Scannez pour accéder au site (Version Française)</div>
    
    <div class="qr-container">
      <img src="/qrcode-fr.svg" alt="QR Code Muhsana Ali" />
    </div>

    <div class="url">https://muhsana.com/fr/?src=qr</div>

    <button class="btn-print" onclick="window.print()">Imprimer en grand format</button>
  </div>

</body>
</html>
