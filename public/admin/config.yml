local_backend: true
backend:
  name: git-gateway
  branch: main

media_folder: "public"
public_folder: ""

collections:
  - name: "projects"
    label: "Projets Communautaires"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre du Projet", name: "title", widget: "string" }
      - { label: "Sous-titre / Description Courte", name: "subtitle", widget: "string" }
      - { label: "Badge d'affichage (ex: Projet, Atelier, Installation...)", name: "badge", widget: "string", default: "Projet" }
      - label: "Placer dans la Section (Sélectionner parmi vos sections de la Page d'Accueil)"
        name: "section"
        widget: "relation"
        collection: "pages"
        file: "home"
        search_fields: ["blocks.*.title", "blocks.*.sectionFilter"]
        value_field: "blocks.*.sectionFilter"
        display_fields: ["blocks.*.title"]
        required: false
      - { label: "Ordre d'affichage", name: "order", widget: "number", default: 1 }
      - { label: "Image de Couverture Hero", name: "heroImage", widget: "image" }
      - { label: "Titre Meta (SEO)", name: "metaTitle", widget: "string", required: false }
      - { label: "Description Meta (SEO)", name: "metaDescription", widget: "text", required: false }
      - { label: "Galerie d'images (6 premières visibles sur la grille)", name: "galleryImages", widget: "list", required: false, field: { label: "Image", name: "image", widget: "image" } }
      - { label: "Titre de la Section Principale", name: "mainHeading", widget: "string", required: false }
      - { label: "Paragraphe d'accroche (Lead)", name: "leadParagraph", widget: "text", required: false }
      - { label: "Paragraphes détaillés", name: "paragraphs", widget: "list", required: false, field: { label: "Paragraphe", name: "paragraph", widget: "text" } }
      - { label: "Citation de l'Artiste", name: "quote", widget: "string", required: false }
      - label: "Articles & Liens Externes"
        name: "externalLinks"
        widget: "list"
        required: false
        fields:
          - { label: "Icône Emoji", name: "icon", widget: "string" }
          - { label: "Tag / Source", name: "tag", widget: "string" }
          - { label: "Titre de l'article", name: "title", widget: "string" }
          - { label: "Description", name: "desc", widget: "text" }
          - { label: "URL du lien", name: "url", widget: "string" }
          - { label: "Texte du bouton", name: "btnText", widget: "string" }
      - label: "Fiche Technique (Sidebar)"
        name: "sidebarMeta"
        widget: "list"
        required: false
        fields:
          - { label: "Libellé (ex: Année)", name: "label", widget: "string" }
          - { label: "Valeur (ex: 2023)", name: "value", widget: "string" }
      - { label: "URL Vidéo YouTube Intégrée", name: "embeddedVideoYoutubeUrl", widget: "string", required: false }
      - label: "Projet Précédent"
        name: "prevProject"
        widget: "object"
        required: false
        fields:
          - { label: "Slug du projet", name: "slug", widget: "string" }
          - { label: "Titre du projet", name: "title", widget: "string" }
      - label: "Projet Suivant"
        name: "nextProject"
        widget: "object"
        required: false
        fields:
          - { label: "Slug du projet", name: "slug", widget: "string" }
          - { label: "Titre du projet", name: "title", widget: "string" }

  - name: "artworks"
    label: "Œuvres & Galeries"
    folder: "src/content/artworks"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre Complet de la Série", name: "title", widget: "string" }
      - { label: "Titre d'Affichage", name: "displayTitle", widget: "string" }
      - label: "Catégorie de Filtre"
        name: "category"
        widget: "select"
        options:
          - { label: "Sculpture & Installation", value: "sculpture" }
          - { label: "Alternative Mosaic", value: "mosaic" }
          - { label: "Photography", value: "photography" }
          - { label: "Peinture", value: "peinture" }
      - { label: "Sous-titre / Libellé Catégorie", name: "categoryLabel", widget: "string", required: false }
      - { label: "Badge d'Affichage", name: "badge", widget: "string" }
      - { label: "Ordre d'affichage", name: "order", widget: "number", default: 1 }
      - { label: "Description Courte", name: "desc", widget: "string" }
      - { label: "Description de la Carte", name: "cardDesc", widget: "text" }
      - { label: "Image de Couverture", name: "coverImage", widget: "image" }
      - { label: "Galerie d'images (Diaporama Lightbox)", name: "images", widget: "list", required: false, field: { label: "Image", name: "image", widget: "image" } }

  - name: "pages"
    label: "Pages du Site"
    files:
      - file: "src/content/pages/home.json"
        label: "Page d'Accueil (Configuration & Blocs)"
        name: "home"
        fields:
          - label: "Titre SEO Meta"
            name: "title"
            widget: "string"
            default: "Muhsana Ali | Artiste Multidisciplinaire"
          - label: "Description SEO Meta"
            name: "description"
            widget: "text"
            default: "Site officiel de l'artiste Muhsana Ali."
          - label: "Blocs & Sections de la Page d'Accueil"
            name: "blocks"
            widget: "list"
            types:
              - label: "Section Hero (Bannière d'en-tête)"
                name: "hero_block"
                widget: "object"
                fields:
                  - { label: "Activer cette section", name: "active", widget: "boolean", default: true }
              - label: "Section À Propos"
                name: "about_block"
                widget: "object"
                fields:
                  - { label: "Activer cette section", name: "active", widget: "boolean", default: true }
              - label: "Section Projets (Personnalisable)"
                name: "projects_block"
                widget: "object"
                fields:
                  - { label: "Titre de la Section", name: "title", widget: "string", default: "Projets" }
                  - { label: "Identifiant Unique de la Section (ex: section1, section2, ateliers)", name: "sectionFilter", widget: "string", default: "section1" }
                  - { label: "Sous-titre de la Section", name: "subtitle", widget: "string", default: "Engagement Communautaire & Œuvres Majeures" }
              - label: "Section Œuvres & Galeries"
                name: "artworks_block"
                widget: "object"
                fields:
                  - { label: "Activer cette section", name: "active", widget: "boolean", default: true }
              - label: "Section Carte Interactive"
                name: "map_block"
                widget: "object"
                fields:
                  - { label: "Activer cette section", name: "active", widget: "boolean", default: true }

